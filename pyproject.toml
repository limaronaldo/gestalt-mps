[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[project]
name = "gestalt-mps"
version = "0.1.0"
description = "Local Gestalt inference on Apple Silicon with PyTorch"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.11,<3.15"
dependencies = [
    "huggingface-hub>=1.3.0,<2",
    "numpy>=1.26.4",
    "pillow>=13.0.0",
    "safetensors==0.7.0",
    "tokenizers==0.22.2",
    "torch==2.10.0",
    "transformers==5.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gestalt = "gestalt_mps.cli:main"

[tool.uv.build-backend]
module-name = ["gestalt", "gestalt_mps"]
source-exclude = [".cache", ".env", ".env.*", "*.ckpt", "*.safetensors"]
